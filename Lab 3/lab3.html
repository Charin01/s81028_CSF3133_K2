<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-5">
        <title>Inline Calculator</title>
    </head>
    <body>
        <div id="header">
            <h1>A Contact Form</h1>
            <span>A contact from with an inline calculator!</span>
        </div>
        <div id="content">
            <h2>Enter your contact information</h2>
            <form action="">
                <label for="email">E-mail: </label><br>
                <input type="email" id="email" name="email" required><br><br>
                <label for="date_input">Preferred Contact Date: </label><br>
                <input type="date" id="date_input" name="date_input"><br><br>
                <label for="user_satisfaction">Satisfaction Level(0 to 10)</label><br>
                <input type="range" id="user_satisfaction"
                name="user_satisfaction" min="0" max="10"><br><br>
                <button type="submit">Submit</button>
            </form>
            <div>
                <h2>Inline Calculator</h2>
                <form oninput="total.value = Number(first.value) + Number(second.value)">
                    <label for="first">First value: </label>
                    <input type="number" id="first" name="first" value="0">
                    <label for="second">Second value: </label>
                    <input type="number" id="second" name="second" value="0">
                    <p>
                        Sum:
                        <output name="total" for="first second">0</output>
                    </p>
                </form>
            </div>
        </div>
        <div id="footer">
            <p>Visit our social: <a href=www.umt.edu.my>Instragram</a></p>
            <p>Copyright (c) 2026 Contact Form & Inline Calculator</p>
        </div>
    </body>
</html>
